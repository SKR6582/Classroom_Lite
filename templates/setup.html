<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#0d1420">
    <title>{{ "초기 설정" if mode == "setup" else "설정" }} · Classroom TV Lite</title>
    <link rel="stylesheet" href="/static/css/app.css">
    <script>window.SETTINGS_MODE = {{ mode|tojson }};</script>
    <script type="module" src="/static/js/settings.js"></script>
  </head>
  <body class="settings-page">
    <main class="settings-shell">
      <header class="settings-header">
        <div>
          <p class="eyebrow">Classroom TV Lite</p>
          <h1>{{ "처음 사용할 정보를 입력하세요" if mode == "setup" else "대시보드 설정" }}</h1>
        </div>
        <div class="header-actions">
          <a id="help-link" class="secondary-button" href="#" target="_blank" rel="noreferrer" hidden>설정 도움말</a>
          {% if mode == "settings" %}<a class="secondary-button" href="/">대시보드</a>{% endif %}
        </div>
      </header>
      <section class="settings-tools" aria-label="설정 백업">
        <label class="check-label">
          <input id="include-api-key" type="checkbox">
          백업 파일에 API 키 포함
        </label>
        <button id="export-settings" class="secondary-button" type="button">설정 내보내기</button>
        <label class="secondary-button file-button">
          설정 가져오기
          <input id="import-settings" type="file" accept="application/json,.json" hidden>
        </label>
      </section>

      <form id="settings-form">
        <section class="form-card">
          <h2>1. 학급과 NEIS</h2>
          <div class="form-grid">
            <label>학급 이름<input name="classroom_name" required placeholder="예: 2학년 1반"></label>
            <label class="wide">NEIS API 키
              <input name="api_key" type="password" autocomplete="off" placeholder="저장된 키는 다시 표시되지 않습니다">
              <small id="key-status"></small>
            </label>
            <label class="wide">학교명 검색
              <span class="inline-field">
                <input id="school-query" placeholder="학교 이름을 입력하세요">
                <button id="school-search" type="button">검색</button>
              </span>
            </label>
          </div>
          <div id="school-results" class="school-results"></div>
          <div class="form-grid compact">
            <label>학교명<input name="school_name" required></label>
            <label>학교급
              <select name="school_kind" required>
                <option value="">선택</option>
                <option>초등학교</option><option>중학교</option><option>고등학교</option><option>특수학교</option>
              </select>
            </label>
            <label>교육청 코드<input name="office_code" required placeholder="예: N10"></label>
            <label>학교 코드<input name="school_code" required placeholder="표준학교코드"></label>
            <label>학년<input name="grade" inputmode="numeric" placeholder="예: 2"></label>
            <label>반<input name="class_name" placeholder="예: 1"></label>
          </div>
        </section>

        <section class="form-card">
          <div class="section-title-row">
            <h2>2. 교시 시간</h2>
            <select name="timetable_source">
              <option value="neis">NEIS 자동 + 수동 fallback</option>
              <option value="manual">수동 시간표 고정</option>
            </select>
          </div>
          <div id="slots-editor" class="slots-editor"></div>
        </section>

        <section class="form-card">
          <h2>3. 주간 기본 시간표</h2>
          <p class="form-help">NEIS 조회가 실패하거나 수동 고정 모드일 때 표시됩니다.</p>
          <div id="week-editor" class="week-editor"></div>
        </section>

        <section class="form-card">
          <h2>4. 오늘 시간표 보정</h2>
          <label>날짜<input id="override-date" type="date"></label>
          <div id="override-editor" class="override-editor"></div>
          <button id="clear-override" class="secondary-button" type="button">이 날짜 보정 삭제</button>
        </section>

        <section class="form-card">
          <h2>5. 공지</h2>
          <label>하단 한 줄 공지<input name="notice" maxlength="240" placeholder="예: 오늘 6교시 체육관 집합"></label>
          <input name="help_url" type="hidden">
        </section>

        <p id="form-message" class="form-message" role="status"></p>
        <div class="sticky-actions">
          <button class="primary-button" type="submit">저장하고 대시보드 열기</button>
        </div>
      </form>
    </main>
  </body>
</html>
