<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#0d1420">
    <title>Classroom TV Lite</title>
    <link rel="manifest" href="/static/manifest.webmanifest">
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/css/app.css">
    <script type="module" src="/static/js/dashboard.js"></script>
  </head>
  <body class="dashboard-page">
    <main class="dashboard" aria-live="polite">
      <section class="dashboard-grid">
        <div class="left-column">
          <article class="panel clock-panel">
            <time id="clock" class="clock">00:00:00</time>
            <span id="current-date">날짜 불러오는 중</span>
            <strong id="classroom-name">교실</strong>
          </article>

          <article id="status-panel" class="panel status-panel">
            <span class="card-label">현재 일과</span>
            <strong id="period-label">시간표 확인 중</strong>
            <span id="countdown">확인 중</span>
            <small id="period-time"></small>
            <span id="wake-status" class="wake-status" hidden></span>
          </article>

          <article class="panel notice-panel">
            <span class="card-label">공지</span>
            <div class="notice-content">
              <span aria-hidden="true">•</span>
              <strong id="notice-text">등록된 공지가 없습니다.</strong>
            </div>
          </article>
        </div>

        <article class="panel meal-panel">
          <div class="panel-heading">
            <h1 id="meal-title">오늘의 점심</h1>
            <button id="meal-refresh" class="icon-button" type="button" aria-label="급식 새로고침" title="급식 새로고침">↻</button>
          </div>
          <ul id="meal-list" class="meal-list">
            <li class="muted">급식을 불러오는 중입니다.</li>
          </ul>
          <p id="meal-message" class="panel-message"></p>
        </article>

        <article class="panel timetable-panel">
          <div class="panel-heading">
            <h1>시간표</h1>
            <span class="timetable-actions">
              <span id="timetable-source" class="source-badge"></span>
              <button id="timetable-refresh" class="icon-button" type="button" aria-label="시간표 새로고침" title="시간표 새로고침">↻</button>
            </span>
          </div>
          <ol id="timetable-list" class="timetable-list"></ol>
        </article>
      </section>
      <footer class="dashboard-footer">
        <a class="github-link" href="https://github.com/SKR6582" target="_blank" rel="noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 .7A11.5 11.5 0 0 0 8.4 23c.6.1.8-.3.8-.6v-2.2c-3.3.7-4-1.4-4-1.4-.6-1.4-1.4-1.8-1.4-1.8-1.1-.8.1-.8.1-.8 1.2.1 1.9 1.3 1.9 1.3 1.1 1.9 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.6.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0C15.8 4.7 16.8 5 16.8 5c.6 1.5.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.8 5.4-5.5 5.7.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A11.5 11.5 0 0 0 12 .7Z"/>
          </svg>
          <span>@SKR6582</span>
        </a>
        <a id="notion-guide" class="notion-guide" href="#" target="_blank" rel="noreferrer" hidden>
          <img id="notion-qr" alt="Notion 상세 설정 가이드 QR 코드" width="44" height="44">
          <span>상세 설정<br>가이드</span>
        </a>
        <a class="settings-link" href="/settings" aria-label="설정" title="설정">⚙</a>
      </footer>
    </main>
  </body>
</html>
